[package]
name = "anon-flatten"
version = "0.1.1"
edition = "2024"
authors = ["yenharvey <2117555041@qq.com>"]
description = "一个简单的文件目录扁平化工具，让复杂的嵌套文件夹结构变得和爱音一样平 | A simple file directory flattening tool inspired by Anon Chihaya"
license = "MIT"
repository = "https://github.com/mygo-studio/anon-flatten.git"
homepage = "https://github.com/mygo-studio/anon-flatten"
documentation = "https://docs.rs/anon-flatten"
readme = "README.md"
keywords = ["cli", "file-management", "flatten", "mygo", "anon-chihaya"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
colored = "3.1.1"
indicatif = "0.18.3"
thiserror = "2.0.18"
walkdir = "2.5.0"

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = [
    "user-hooks",
] }
tempfile = "3.24.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "anon-flatten"
path = "src/main.rs"

[lib]
name = "anon_flatten"
path = "src/lib.rs"
